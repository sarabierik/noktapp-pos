appId: com.noktapp.pos
productName: NoktApp POS
copyright: NOKTApp
directories:
  output: ../dist
  buildResources: assets

# The shell itself is tiny; everything the restaurant needs is carried in
# extraResources, so the installer is one file and nothing is downloaded later.
files:
  - src/**/*
  - assets/**/*
  - package.json
  - "!**/*.map"

extraResources:
  - from: ../pos-service
    to: pos-service
    filter:
      - "**/*"
      - "!test/**"
      - "!**/*.log"
  - from: ../database
    to: database
    filter: ["*.sql", "migrations/**"]
  - from: ../vendor/mariadb
    to: mariadb

win:
  target:
    - target: nsis
      arch: [x64]
  icon: assets/icon.ico
  artifactName: NoktAppPOS-Setup-${version}.${ext}
  requestedExecutionLevel: requireAdministrator

nsis:
  # A cosmetic NSIS warning must not fail a customer's build. Real errors
  # still stop it; this only stops warning 6000 and friends from being fatal.
  warningsAsErrors: false

  # Branding. Without these four lines NSIS draws its own 1990s blue ribbon,
  # which is what every build from 3.7.1 to 3.9.0 shipped: correct software
  # behind a wizard that looks like nobody owns it. A restaurant owner watching
  # you install it reads that as the whole product.
  #   installerSidebar  164x314 BMP - the welcome and finish pages
  #   installerHeader   150x57  BMP - the strip on every inner page
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  installerSidebar: assets/installerSidebar.bmp
  uninstallerSidebar: assets/installerSidebar.bmp
  installerHeader: assets/installerHeader.bmp
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: NoktApp POS
  installerLanguages: [tr_TR]
  language: 1055
  include: ../installer/installer.nsh
  deleteAppDataOnUninstall: false

publish:
  provider: generic
  url: https://pos.noktapp.com/indir
  channel: latest
