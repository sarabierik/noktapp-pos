name: nokta
description: "NOKTA - restoranlarin kampanyalarini tek cuzdanda toplayan misafir uygulamasi."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # ASSET KLASORU YOK, VE OLMAMALI.
  #
  # Burada bir `assets: - assets/` satiri vardi. Klasor bos oldugu icin git
  # onu hicbir zaman takip etmedi, yani temiz bir klonda (Android Studio'da ya
  # da CI'da) o klasor hic yok - ve Flutter bunu tek bir Dart satiri derlemeden
  # once "unable to find directory entry in pubspec.yaml: assets/" diye
  # reddediyor. Uygulama zaten hicbir asset okumuyor: ikonlar Android res/
  # icinde, N isareti ekranda ciziliyor. Gerceginden bir asset gerekirse once
  # klasoru dosyayla birlikte ekleyin, sonra bu satiri geri getirin.
