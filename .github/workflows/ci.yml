name: CI

# Every push and every pull request. The point of this file is that the test
# bench stops being voluntary: it is excellent and, until now, nothing forced
# it to run.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --prefix pos-service --no-audit --no-fund
      # ESLint 9 looks for its flat config in the working directory, and the
      # config lives in pos-service/. Run from the repo root and it reports
      # "couldn't find eslint.config.js" and fails the job without ever
      # looking at a line of code.
      - name: ESLint
        working-directory: pos-service
        run: npx eslint .

  audit:
    name: npm audit (production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # Only production dependencies: a dev-only advisory cannot reach a till,
      # and failing the build on one teaches everyone to ignore this job.
      # `high` is the gate; the two open moderates are documented in
      # docs/GUVENLIK.md with the reason they are accepted.
      - run: npm audit --prefix pos-service --omit=dev --audit-level=high

  test:
    name: Servis sınamaları (kasa)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: noktapp_pos
          MARIADB_USER: noktapp
          MARIADB_PASSWORD: nokpass
        ports: ['3399:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # PHP is here for the till's sake, not the panel's.
      #
      # The first run of this job skipped the four panel suites and assumed the
      # rest of the bench did not care. It does. A till that has never spoken to
      # the panel has no licence, so the login screen stops at "İşletme girişi"
      # and never reaches the PIN pad - which is where ui, ui-all, yardim,
      # qrmenu and station all begin. Fourteen of ui's seventeen checks timed
      # out clicking a screen that was never going to appear.
      #
      # So the panel runs here as infrastructure: it is what makes the machine
      # an activated machine. The panel's OWN suites are the job below.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, json, zip, gd

      - run: npm ci --prefix pos-service --no-audit --no-fund

      # The till's backup and restore shell out to `mariadb-dump` and
      # `mariadb` BY NAME - the binaries that ship inside the installer next
      # to the bundled server, which is what a customer's machine actually
      # runs. The runner image carries MySQL's client instead, so every
      # backup check came back "spawn mariadb-dump ENOENT", loyalty lost
      # seventeen checks to a fixture that could not reach the shared
      # registry, and geri - the suite that restores a database - could not
      # start at all. Installing the real client is the honest fix: pointing
      # the code at mysqldump would test a path no till has.
      - name: MariaDB client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-client
          for b in mariadb mariadb-dump mysql; do
            command -v "$b" >/dev/null || { echo "still missing: $b"; exit 1; }
          done
          mariadb-dump --version

      # The fixture drops and rebuilds nokpos_panel and nokpos_shared, and the
      # service container only grants its user rights on the one database it
      # was told to create. Without this the fixture's first statement comes
      # back "Access denied for user 'noktapp'@'%'". Throwaway container.
      - name: Let the fixture create its databases
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3399 -uroot -proot \
            -e "GRANT ALL PRIVILEGES ON *.* TO 'noktapp'@'%'; FLUSH PRIVILEGES;"

      # ui, ui-all, yardim, qrmenu and station drive a real Chromium. The
      # sandbox this repo grew up in keeps one at /opt/pw-browsers and every
      # suite used to hard-code that path, so on a runner they all died with
      # "executable doesn't exist" before their first assertion. The path is
      # gone now (test/tarayici.js); what is left is fetching the browser.
      # --with-deps is gone deliberately. It runs apt-get under sudo, takes
      # minutes, and the ubuntu-latest image already ships the libraries
      # Chromium needs. If a library really is missing, the launch error in
      # the artifact will name it - which is better than a silent ten minute
      # step that might be the thing failing.
      - name: Install Chromium for the browser suites
        working-directory: pos-service
        run: |
          set -o pipefail
          npx playwright install chromium 2>&1 | tee -a /tmp/ci-adimlar.log
          node -e "const {chromeYolu}=require('./test/tarayici');console.log('chrome:',chromeYolu()||'(playwright bundled)')" 2>&1 | tee -a /tmp/ci-adimlar.log

      # Waiting quietly and carrying on regardless is how a panel that never
      # came up turned into thirty confusing suite failures. If 8090 does not
      # answer, say so here and stop.
      - name: Build the panel and serve it
        working-directory: pos-service
        env:
          DB_PORT: '3399'
          DB_USER: noktapp
          DB_PASS: nokpass
        run: |
          nohup bash test/panel-fixture.sh --serve > /tmp/panel.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8090/ && break
            sleep 2
          done
          if ! curl -s -o /dev/null --max-time 5 http://127.0.0.1:8090/; then
            echo "The panel never answered on 8090. Its own log:"
            cat /tmp/panel.log || true
            exit 1
          fi
          curl -s -o /dev/null -w 'panel: %{http_code}\n' http://127.0.0.1:8090/ | tee -a /tmp/ci-adimlar.log

      # tee, so that whatever the bench says ends up in the artifact as well
      # as in this log. Reading a failure should not require access to this
      # page - the zip should be enough on its own.
      - name: Run the bench
        working-directory: pos-service
        env:
          DB_PORT: '3399'
          DB_USER: noktapp
          DB_PASS: nokpass
          NOKTAPP_DATA_DIR: /tmp/nokdata
        run: |
          set -o pipefail
          bash test/run-all.sh 2>&1 | tee /tmp/tezgah.log

      # always(), not failure(): a step that dies before the bench used to
      # produce no artifact at all, which left nothing to read.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sinama-gunlukleri
          path: |
            /tmp/tezgah.log
            /tmp/ci-adimlar.log
            /tmp/panel.log
            /tmp/nokdata/logs
            pos-service/test/shots
          if-no-files-found: ignore
          retention-days: 7

  panel:
    name: Panel sınamaları (PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The panel is the other half of the product - the admin screens, the chain
    # menu, the reports, the diagnostics, the alerts. It is PHP with its own
    # suites under panel/tests/, and until now they only ever ran on one laptop.
    # Running one half and calling it "the tests passed" is how a half ships
    # broken; that is what test/tumu.sh exists to say, so CI says it too.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_USER: noktapp
          MARIADB_PASSWORD: nokpass
        ports: ['3399:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, curl, json, zip, gd
      - run: npm ci --prefix pos-service --no-audit --no-fund

      # panel-fixture.sh drops and rebuilds TWO databases - nokpos_panel and
      # nokpos_shared - and the service container only ever grants its user
      # rights on the single database it was told to create. So the fixture's
      # very first statement came back "Access denied for user 'noktapp'@'%'
      # to database 'nokpos_panel'" and the whole job fell over there. This
      # container is thrown away at the end of the job; widen it.
      - name: Let the fixture create its databases
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -P 3399 -uroot -proot \
            -e "GRANT ALL PRIVILEGES ON *.* TO 'noktapp'@'%'; FLUSH PRIVILEGES;"

      # The fixture builds the panel schema, one test tenant (client 19), an
      # active licence and the shared guest registry, then starts the four php
      # workers behind the proxy. It drops and rebuilds both databases every
      # run - which is exactly why it must never be pointed at a live one.
      - name: Build the panel and serve it
        working-directory: pos-service
        env:
          DB_PORT: '3399'
          DB_USER: noktapp
          DB_PASS: nokpass
        run: |
          nohup bash test/panel-fixture.sh --serve > /tmp/panel.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:8090/ && break
            sleep 2
          done
          curl -s -o /dev/null -w 'panel: %{http_code}\n' http://127.0.0.1:8090/

      - name: Run the panel suites
        working-directory: pos-service
        env:
          DB_PORT: '3399'
          DB_USER: noktapp
          DB_PASS: nokpass
        run: |
          set -o pipefail
          bash test/tumu.sh --panel-only 2>&1 | tee /tmp/panel-suites.log

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panel-gunlukleri
          path: |
            /tmp/panel-suites.log
            /tmp/panel.log
            panel/tests/shots
          if-no-files-found: ignore
          retention-days: 7
